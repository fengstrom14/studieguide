<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interaktiv studieguide</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#243247;background:#edf1f5}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cad3df;background:white;color:#263b56;border-radius:8px;padding:9px 12px}button:hover{background:#eaf1f9}.wrap{max-width:930px;margin:auto;padding:24px 18px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:20px;margin:0}.muted{color:#68788d;font-size:13px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:15px 0}.paper{background:white;border:1px solid #dce2e9;box-shadow:0 7px 28px #1d2b3a10;border-radius:12px;padding:clamp(24px,6vw,60px)}.kicker{color:#577a9c;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.doc-title{font-size:clamp(28px,4vw,39px);font-weight:750;line-height:1.2;margin:12px 0}.intro{font-size:16px;line-height:1.75;color:#52647a}.progress{margin:22px 0 36px}.progress-head{display:flex;justify-content:space-between;font-size:13px;color:#5b6d80;margin-bottom:8px}.track{height:9px;background:#e8edf2;border-radius:12px;overflow:hidden}.fill{height:100%;width:0;background:#3a9879;transition:width .2s}.block{position:relative;margin:22px 0;line-height:1.75}.block.heading{margin-top:39px;border-bottom:1px solid #e0e5eb;padding-bottom:10px}.heading h2{font-size:23px;line-height:1.3;margin:0}.block.text p{white-space:pre-wrap;margin:0;color:#344357}.task{display:flex;gap:13px;align-items:flex-start;background:#f5f8fb;border:1px solid #e2e9ef;padding:15px;border-radius:9px}.task input{width:21px;height:21px;accent-color:#278363;margin:3px 0 0;flex-shrink:0;cursor:pointer}.task label{cursor:pointer;flex:1;white-space:pre-wrap}.task.done{background:#edf7f2;border-color:#c8e6d7}.task.done label{color:#637d72;text-decoration:line-through}.colorblock{display:flex;align-items:center;gap:13px;background:#f6f8fb;border:1px solid #e3e8ee;padding:13px;border-radius:9px;flex-wrap:wrap}.swatch{width:49px;height:49px;border:1px solid #0002;border-radius:9px;flex-shrink:0}.hex{font-family:ui-monospace,monospace;font-weight:700;background:#e9eef5;padding:5px 8px;border-radius:5px}.colorname{flex:1}.edit-tools{display:none;gap:5px;align-items:center;margin-top:8px;flex-wrap:wrap}.editing .edit-tools{display:flex}.editing .block{outline:1px dashed #ccd7e4;outline-offset:9px}.editing .task label{cursor:default}.editing textarea{width:100%;min-height:76px;border:1px solid #c9d4e1;border-radius:7px;padding:10px;resize:vertical;line-height:1.5}.editing .heading textarea{font-size:22px;font-weight:700}.editing .doc-title-input{width:100%;font-size:28px;font-weight:700}.editing .intro-input{width:100%}.editing .color-picker{width:45px;height:38px;padding:0}.editing .task input{pointer-events:none}.hidden{display:none!important}.footer{margin-top:20px}.primary{background:#245c83;color:white;border-color:#245c83}.primary:hover{background:#1b4868}.empty{color:#8794a4;padding:30px 0}@media(max-width:600px){.wrap{padding:15px 10px 50px}.paper{padding:23px 18px}.heading h2{font-size:21px}}
</style></head><body><div class="wrap"><header class="top"><div><h1>Interaktiv studieguide</h1><span class="muted">Läs uppifrån och ned och bocka av i din egen takt.</span></div><div class="actions"><button id="mode" class="primary">Redigera dokument</button><button id="export">Spara fil</button><button id="import">Öppna fil</button><input id="file" type="file" accept=".json,application/json" hidden></div></header><div id="toolbar" class="toolbar hidden"><button data-add="heading">+ Rubrik</button><button data-add="text">+ Text</button><button data-add="check">+ Checklista</button><button data-add="color">+ Färg</button><button id="new">Nytt dokument</button></div><main class="paper" id="paper"><div class="kicker">STUDIEDOKUMENT</div><h1 id="title" class="doc-title"></h1><textarea id="titleEdit" class="doc-title-input hidden" aria-label="Titel"></textarea><p id="intro" class="intro"></p><textarea id="introEdit" class="intro-input hidden" aria-label="Introduktion"></textarea><div class="progress"><div class="progress-head"><span>Din framgång</span><strong id="count">0 av 0 klara</strong></div><div class="track"><div id="fill" class="fill"></div></div></div><div id="blocks"></div></main><p class="muted footer">Dina ändringar och avbockningar sparas automatiskt i webbläsaren. Använd ”Spara fil” för att göra en säkerhetskopia.</p></div><script>
const KEY='study-guide-v2', $=id=>document.getElementById(id),uid=()=>String(Date.now())+Math.random().toString(36).slice(2);const example=()=>({title:'Kom igång med CSS och Sass',intro:'Följ avsnitten i ordning. Läs förklaringen, genomför uppgiften och bocka av den när du är färdig.',blocks:[{id:uid(),type:'heading',text:'1. Vad är CSS?'},{id:uid(),type:'text',text:'CSS används för att styra hur en webbsida ser ut. Med CSS kan du ändra exempelvis färger, marginaler, typsnitt och placering.\n\nLäs igenom teorin innan du fortsätter till övningen.'},{id:uid(),type:'check',text:'Jag förstår skillnaden mellan HTML (struktur) och CSS (utseende).',checked:false},{id:uid(),type:'heading',text:'2. Färger och HEX-koder'},{id:uid(),type:'text',text:'En HEX-kod beskriver en färg med sex tecken efter #. Färgrutan nedan visar färgen direkt bredvid koden.'},{id:uid(),type:'color',text:'Grön – exempel på accentfärg',hex:'#4CAF50'},{id:uid(),type:'color',text:'Mörkblå – exempel på bakgrund',hex:'#243247'},{id:uid(),type:'check',text:'Jag kan använda en HEX-kod i CSS, till exempel color: #4CAF50;',checked:false},{id:uid(),type:'heading',text:'3. Nästa steg: Sass'},{id:uid(),type:'text',text:'Sass är ett verktyg som gör det enklare att organisera och återanvända CSS, bland annat med variabler och nästlade regler.'},{id:uid(),type:'check',text:'Jag har läst introduktionen till Sass.',checked:false}]});let doc;try{doc=JSON.parse(localStorage.getItem(KEY))||example()}catch{doc=example()}if(!doc||!Array.isArray(doc.blocks))doc=example();let editing=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(doc))}catch{}}function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function progress(){const all=doc.blocks.filter(b=>b.type==='check');const done=all.filter(b=>b.checked).length;$('count').textContent=`${done} av ${all.length} klara`;$('fill').style.width=(all.length?done/all.length*100:0)+'%'}function render(){document.body.classList.toggle('editing',editing);$('toolbar').classList.toggle('hidden',!editing);$('mode').textContent=editing?'Klart – börja läsa':'Redigera dokument';$('title').classList.toggle('hidden',editing);$('intro').classList.toggle('hidden',editing);$('titleEdit').classList.toggle('hidden',!editing);$('introEdit').classList.toggle('hidden',!editing);$('title').textContent=doc.title;$('intro').textContent=doc.intro||'';$('titleEdit').value=doc.title;$('introEdit').value=doc.intro||'';const root=$('blocks');root.replaceChildren();if(!doc.blocks.length)root.append(el('p','empty','Inget innehåll ännu. Klicka på Redigera dokument för att lägga till avsnitt.'));doc.blocks.forEach((b,i)=>{const row=el('section','block '+b.type);if(editing){const area=el('textarea');area.value=b.text||'';area.setAttribute('aria-label','Redigera innehåll');area.oninput=()=>{b.text=area.value;save()};row.append(area);if(b.type==='color'){const picker=el('input','color-picker');picker.type='color';picker.value=/^#[0-9a-f]{6}$/i.test(b.hex)?b.hex:'#4CAF50';const hex=el('span','hex',picker.value.toUpperCase());picker.oninput=()=>{b.hex=picker.value;hex.textContent=b.hex.toUpperCase();save()};row.append(picker,hex)}const tools=el('div','edit-tools');[['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['Ta bort',()=>{doc.blocks.splice(i,1);save();render()}]].forEach(([label,fn])=>{const btn=el('button','',label);btn.onclick=fn;tools.append(btn)});row.append(tools)}else if(b.type==='heading'){row.append(el('h2','',b.text))}else if(b.type==='text'){row.append(el('p','',b.text))}else if(b.type==='check'){const task=el('div','task'+(b.checked?' done':''));const check=el('input');check.type='checkbox';check.id='task-'+i;check.checked=!!b.checked;const label=el('label','',b.text);label.htmlFor=check.id;check.onchange=()=>{b.checked=check.checked;task.classList.toggle('done',b.checked);save();progress()};task.append(check,label);row.append(task)}else if(b.type==='color'){const color=/^#[0-9a-f]{6}$/i.test(b.hex)?b.hex:'#4CAF50';const box=el('div','colorblock');const sw=el('span','swatch');sw.style.background=color;box.append(sw,el('span','colorname',b.text),el('span','hex',color.toUpperCase()));row.append(box)}root.append(row)});progress()}function move(i,delta){const j=i+delta;if(j<0||j>=doc.blocks.length)return;[doc.blocks[i],doc.blocks[j]]=[doc.blocks[j],doc.blocks[i]];save();render()}$('mode').onclick=()=>{editing=!editing;render()};$('titleEdit').oninput=e=>{doc.title=e.target.value;save()};$('introEdit').oninput=e=>{doc.intro=e.target.value;save()};document.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{const type=btn.dataset.add;doc.blocks.push({id:uid(),type,text:'',checked:false,hex:'#4CAF50'});save();render();const areas=$('blocks').querySelectorAll('textarea');areas[areas.length-1]?.focus()});$('new').onclick=()=>{if(confirm('Skapa ett tomt dokument? Spara gärna nuvarande dokument till fil först.')){doc={title:'Nytt dokument',intro:'',blocks:[]};save();render()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(doc.title||'studiedokument').replace(/[^a-zA-ZåäöÅÄÖ0-9 _-]/g,'').trim()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(typeof d.title!=='string'||!Array.isArray(d.blocks)||!d.blocks.every(b=>['heading','text','check','color'].includes(b.type)&&typeof b.text==='string'))throw Error('Felaktigt filformat');doc={title:d.title,intro:typeof d.intro==='string'?d.intro:'',blocks:d.blocks.map(b=>({id:uid(),type:b.type,text:b.text,checked:!!b.checked,hex:/^#[0-9a-f]{6}$/i.test(b.hex)?b.hex:'#4CAF50'}))};editing=false;save();render()}catch(err){alert('Kunde inte öppna filen: '+err.message)}e.target.value=''};render();
</script></body></html>
